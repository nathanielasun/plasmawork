name: TEMPLATE
version: 0.1.0
type: visualization
description: Visualization tool template — renders run data into a figure / animation.
author: local
status: draft
entrypoint: src/tool.py:VisualizationTemplate

inputs:
  - name: time
    type: array
    units: s
  - name: field
    type: array
    units: dimensionless
    description: 1-D or 2-D field aligned to the time axis.

outputs:
  - name: figure
    type: figure
    description: A matplotlib figure (or your preferred plot object).

compatible_domains: []

requires:
  python:
    - numpy
    - matplotlib

validation:
  tests:
    - tests/test_template.py
  reference_cases: []

io:
  mode: mixed
  max_inline_bytes: 65536

permissions:
  filesystem: none
  network: none
  high_risk_actions: []
  approval_required: []

ui:
  display_name: Visualization Template
  input_groups:
    - id: field
      title: Field Data
      ports:
        - time
        - field
  output_views:
    - port: figure
      renderer: image

artifacts:
  outputs:
    - name: figure
      kind: image
      mime_type: image/png
      description: Rendered visualization artifact.
