name: TEMPLATE
version: 0.1.0
type: agent
description: Paper-extraction tool template — extracts equations / parameters from a paper file.
author: local
status: draft
entrypoint: src/tool.py:PaperExtractionTemplate

inputs:
  - name: source_path
    type: string
    description: Path to the paper file (PDF / .md / .tex).

outputs:
  - name: extracted_text
    type: string
  - name: extracted_equations
    type: table
    description: One row per detected equation, with the equation text and a position.
  - name: extracted_parameters
    type: table
    description: One row per detected parameter, with name + unit + value.

compatible_domains: []

requires:
  python: []

validation:
  tests:
    - tests/test_template.py
  reference_cases: []

io:
  mode: mixed
  max_inline_bytes: 65536

permissions:
  filesystem: read_artifacts
  network: none
  high_risk_actions: []
  approval_required: []

ui:
  display_name: Paper Extraction Template
  input_groups:
    - id: source
      title: Paper Source
      ports:
        - source_path
  output_views:
    - port: extracted_text
      renderer: report
    - port: extracted_equations
      renderer: table
    - port: extracted_parameters
      renderer: table

artifacts:
  outputs:
    - name: extracted_text
      kind: report
      mime_type: text/markdown
      description: Extracted text prepared for review.
    - name: extracted_equations
      kind: table
      mime_type: application/json
      description: Structured equation candidates.
    - name: extracted_parameters
      kind: table
      mime_type: application/json
      description: Structured parameter candidates.
