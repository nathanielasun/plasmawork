name: TEMPLATE
version: 0.1.0
type: import
description: Import tool template — reads an external file and produces a structured payload.
author: local
status: draft
entrypoint: src/tool.py:ImportTemplate

inputs:
  - name: source_path
    type: string
    description: Path to the file to import.

outputs:
  - name: payload
    type: table
    description: Parsed, validated rows / records from the source.

compatible_domains: []

requires:
  python: []

validation:
  tests:
    - tests/test_template.py
  reference_cases: []

io:
  mode: mixed
  max_inline_bytes: 65536

permissions:
  filesystem: read_artifacts
  network: none
  high_risk_actions: []
  approval_required: []

ui:
  display_name: Import Tool Template
  input_groups:
    - id: source
      title: Source File
      ports:
        - source_path
  output_views:
    - port: payload
      renderer: table

artifacts:
  outputs:
    - name: payload
      kind: table
      mime_type: application/json
      description: Parsed rows for UI preview and downstream tool input.
