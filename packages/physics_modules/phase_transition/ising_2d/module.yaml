name: ising_2d
version: 0.1.0
domain: phase_transition
status: validated

description: |
  2D Ising model on a square lattice with periodic boundary conditions and
  Metropolis single-spin-flip Monte Carlo dynamics. Energy is in units of
  the coupling J, temperature is in units of J/k_B (i.e. T* = k_B T / J).
  The exact Onsager critical temperature for the 2D Ising model is
  T_c* = 2 / ln(1 + sqrt(2)) ≈ 2.269.

inputs:
  - name: lattice_size
    units: dimensionless
  - name: temperature_reduced
    units: dimensionless
  - name: n_sweeps
    units: dimensionless
  - name: equilibration_sweeps
    units: dimensionless
  - name: external_field
    units: dimensionless

outputs:
  - name: magnetization_per_spin
    units: dimensionless
  - name: energy_per_spin
    units: dimensionless
  - name: heat_capacity_per_spin
    units: dimensionless
  - name: susceptibility_per_spin
    units: dimensionless

validity_domain:
  notes:
    - "Square lattice, periodic BCs."
    - "Single-spin-flip Metropolis (no cluster updates)."
    - "Critical region tau ≈ 0 has slow autocorrelation; use n_sweeps >= a few thousand for L >= 16."

references:
  - title: "Onsager, Phys. Rev. 65, 117 (1944)."
    doi: "10.1103/PhysRev.65.117"
  - title: "Newman & Barkema, *Monte Carlo Methods in Statistical Physics*."

dependencies: []

benchmarks:
  - id: low_temperature_ferromagnetic
    description: |
      Far below T_c (T* = 1.0), the equilibrium magnetization per
      spin must be near unity (|m| > 0.95) on an L=8 lattice after
      adequate equilibration.
    reference: "Ising 2D ferromagnetic phase"
    tolerance: "|m| > 0.95"
    artifact: "benchmarks/low_temperature_ferromagnetic.py"
  - id: high_temperature_paramagnetic
    description: |
      Far above T_c (T* = 4.0), the equilibrium magnetization per
      spin must be small (|m| < 0.3) on an L=8 lattice after adequate
      equilibration. Finite-size fluctuations at L=8 push <|m|> up
      from the thermodynamic-limit value, so the bound stays loose.
    reference: "Ising 2D paramagnetic phase"
    tolerance: "|m| < 0.3"
    artifact: "benchmarks/high_temperature_paramagnetic.py"

compatibility:
  schema_version: "0.1"
  backends: ["python_cpu"]
  dimensionalities: [2]

tests:
  unit:
    - tests/unit/test_ising_2d.py
  validation:
    - tests/validation/test_ising_2d_critical_temperature.py
  benchmark:
    - tests/test_benchmarks.py
