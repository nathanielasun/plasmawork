name: plasma_electromagnetic_field
version: 0.1.0
domain: plasma
status: candidate

description: |
  Candidate interface for an electromagnetic-field representation used by
  particle pushers and PIC adapters. Carries a 3-component E/B field on a
  structured grid. This module's job is the data shape + unit contract;
  numerical FDTD/FFT evolution requires a validated field solver/backend.

inputs:
  - name: domain_extent
    units: "meter"
  - name: grid_resolution
    units: "meter"

outputs:
  - name: E_field
    units: "volt / meter"
  - name: B_field
    units: "tesla"

validity_domain:
  notes:
    - "Structured Cartesian grid only; no unstructured / AMR solver is implemented here."
    - "Uniform spacing along each axis."
    - "Data structure + boundary marshalling only; numerical evolution is out of scope for this candidate."

references:
  - title: "Birdsall & Langdon, *Plasma Physics via Computer Simulation*, ch. 4."

dependencies: []

benchmarks: []

compatibility:
  schema_version: "0.1"
  backends: ["python_cpu"]
  dimensionalities: [1, 2, 3]

tests:
  unit:
    - tests/test_electromagnetic_field.py
