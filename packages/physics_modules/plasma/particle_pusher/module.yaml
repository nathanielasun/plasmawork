name: plasma_particle_pusher
version: 0.1.0
domain: plasma
status: candidate

description: |
  Candidate interface for a single-particle pusher driven by E/B fields.
  The reference implementation is the Boris algorithm (semi-implicit,
  2nd-order); scientifically validated runs require binding this interface
  to a validated field solver/PIC backend.

inputs:
  - name: particles
    units: "kilogram"
  - name: E_field
    units: "volt / meter"
  - name: B_field
    units: "tesla"

outputs:
  - name: positions
    units: "meter"
  - name: velocities
    units: "meter / second"

validity_domain:
  notes:
    - "Non-relativistic Boris algorithm (gamma = 1)."
    - "Step size dt < 0.1 / omega_c for cyclotron-orbit stability."
    - "Validated runs await Phase 8 PIC adapter integration."

references:
  - title: "Boris (1970), *Relativistic plasma simulation — optimization of a hybrid code*."

dependencies:
  - name: plasma_electromagnetic_field

benchmarks: []

compatibility:
  schema_version: "0.1"
  backends: ["python_cpu"]
  dimensionalities: [1, 2, 3]

tests:
  unit:
    - tests/test_particle_pusher.py
