name: plasma_pic_adapter
version: 0.1.0
domain: plasma
status: candidate

description: |
  Candidate adapter that composes electromagnetic_field + particle_pusher
  into a PIC step. The interface enforces the wire-up contract; numerical
  Yee-grid field update and current deposition require a validated PIC
  backend/module before scientific use.

inputs:
  - name: particles
    units: kilogram
  - name: fields
    units: dimensionless

outputs:
  - name: trajectories
    units: meter

validity_domain:
  notes:
    - "Interface-only candidate; no self-consistent Yee solver or current deposition is implemented here."

references:
  - title: "Birdsall & Langdon, *Plasma Physics via Computer Simulation*, ch. 1–4."

dependencies:
  - name: plasma_electromagnetic_field
  - name: plasma_particle_pusher

benchmarks: []

compatibility:
  schema_version: "0.1"
  backends: ["python_cpu"]
  dimensionalities: [1, 2, 3]

tests:
  unit:
    - tests/test_pic_adapter.py
