# Agent role configuration.
#
# Each entry defines an agent role from plan §16.1. Roles are gated: `enabled`
# turns the role on, and `human_approval_required_for` lists actions that
# require explicit user approval even when the role is enabled.
#
# Phase 0 — every agent role is disabled by default. Roles flip to enabled in
# the phases that introduce them (notably Phase 4–10).

defaults:
  enabled: false
  log_actions_to: bugs_and_fixes/program.log
  trace_to: provenance/agent_trace.md   # path is relative to capsule
  refuse_on:
    - writing outside allowed roots
    - overwriting <capsule>/src/user_edits/
    - silently fabricating physical coefficients
    - module promotion to trusted without human review
    - external file export without explicit user action

agents:

  - role: orchestrator
    description: Maintains the global task graph and merges parallel agent work.
    enabled: true
    phase: 6
    capabilities: [coordinate_autonomy_pipeline]
    budget:
      max_concurrent_agents: 3
    refuse_on:
      - bypassing approval gates
      - widening scope beyond the user-approved plan

  - role: repository_steward
    description: Enforces repository structure, documentation, and conventions.
    enabled: false
    phase: 0
    capabilities: [edit_docs, run_convention_checker]

  - role: paper_ingestion
    description: Extracts paper content (PDF, arXiv, supplementary).
    enabled: true
    phase: 4
    capabilities: [download_paper, extract_text, extract_tables]
    human_approval_required_for:
      - downloading from external sources outside an allow-list

  - role: physics_interpretation
    description: Converts paper claims into model assumptions and validity domains.
    enabled: true
    phase: 4

  - role: model_spec
    description: Creates and validates structured ModelSpecs from interpretation artifacts.
    enabled: true
    phase: 5

  - role: module_retrieval
    description: Finds reusable modules in the registry that match a ModelSpec.
    enabled: true
    phase: 5

  - role: code_generation
    description: Generates candidate implementation code into a capsule sandbox.
    enabled: true
    phase: 6
    capabilities: [write_to_capsule_generated]
    refuse_on:
      - writing outside <capsule>/src/generated/
      - overwriting <capsule>/src/user_edits/

  - role: numerical_methods
    description: Reviews solver choices and numerical stability.
    enabled: true
    phase: 6

  - role: backend_optimization
    description: Chooses and optimizes execution backend.
    enabled: true
    phase: 8
    capabilities: [select_backend, recommend_backend]
    refuse_on:
      - promoting a backend to validated/trusted without an approval token

  - role: validation
    description: Creates and runs validation tests.
    enabled: true
    phase: 6
    capabilities: [run_tests, write_validation_reports]

  - role: visualization
    description: Builds plots and UI panels.
    enabled: true
    phase: 6

  - role: documentation
    description: Updates docs, README, and usage guides.
    enabled: true
    phase: 1
    capabilities: [edit_docs, edit_readme]

  - role: bug_memory
    description: Checks bugs_and_fixes/ before subsystem modifications.
    enabled: true
    phase: 1
    capabilities: [read_bugfix_log, append_bugfix_entry]

  - role: security_sandbox
    description: Prevents unsafe file or execution behavior. Always-on once any agent is enabled.
    # Per the always-on rule above: as soon as ANY other role flips to
    # enabled, this role MUST be enabled too. The Phase-5 audit found
    # paper_ingestion + physics_interpretation + model_spec +
    # module_retrieval enabled while security_sandbox stayed off — the
    # rule was prose, not enforced. tests/regression/
    # test_security_sandbox_enforcement.py asserts the invariant.
    enabled: true
    phase: 4
    capabilities: [veto]

  - role: release
    description: Packages stable builds and examples.
    enabled: true
    phase: 7

  - role: experiment_design
    description: Generates structured experiment plans (MVP, fidelity ladder, cost, diagnostics, validation path).
    enabled: true
    phase: 10
    capabilities: [emit_experiment_plan]
    refuse_on:
      - emitting a plan without a validation path
      - fabricating coefficients
      - promoting a capsule to validated when placeholders exist

  - role: controlled_sweep
    description: Runs budget-bounded sweeps and emits trend summaries + next-sweep recommendations.
    enabled: true
    phase: 10
    capabilities: [launch_bounded_sweep, summarise_trends]
    budget:
      max_evaluations_per_launch: 32
    refuse_on:
      - exceeding the configured budget
      - silently bypassing failure-rate stop conditions

  - role: scientific_review
    description: Critiques assumptions, identifies missing physics, flags overclaims, recommends validation.
    enabled: true
    phase: 10
    capabilities: [emit_scientific_review]
    refuse_on:
      - writing outside the capsule's review/ subtree
      - mutating user_edits/, paper_sources/, or provenance/

human_approval_gates:
  module_promotion_to_trusted: required
  external_export: required
  destructive_edits: required
  high_compute_runs: required
  destructive_git_operations: required
