name: security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Deployment live probes are opt-in inside their jobs; this schedule keeps
    # the workflow available for protected-runtime checks without adding secrets
    # to the default PR lane.
    - cron: "17 5 * * *"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secure-core-security:
    name: secure-core-security
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PLASMAWORK_SECRETS_PROVIDER: env
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/secure_core/package-lock.json

      - name: Install secure_core dependencies
        run: npm --prefix packages/secure_core ci

      - name: Typecheck secure_core
        run: npm --prefix packages/secure_core run typecheck

      - name: Run Layer 5 security gate
        run: scripts/test/security.sh

      - name: Run supply-chain security guard
        run: scripts/test/security_supply_chain.sh

  workbench-gateway-typecheck-and-tests:
    # Audit fix (2026-05-10): the gateway package was previously
    # excluded from the security workflow. A typecheck regression
    # (unused-var error) shipped to main unnoticed because Vitest does
    # not typecheck. This job closes that gap.
    name: workbench-gateway-typecheck-and-tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/workbench-gateway/package-lock.json

      - name: Install workbench-gateway dependencies
        run: npm --prefix apps/workbench-gateway ci

      - name: Typecheck workbench-gateway
        run: npm --prefix apps/workbench-gateway run typecheck

      - name: Test workbench-gateway
        run: npm --prefix apps/workbench-gateway test

  secure-core-db-live-probes:
    name: secure-core-db-live-probes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PLASMAWORK_SECRETS_PROVIDER: env
      PLASMAWORK_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/secure_core/package-lock.json

      - name: Install secure_core dependencies
        run: npm --prefix packages/secure_core ci

      - name: Run live DB role probes
        run: scripts/test/security_live_db.sh

  secure-core-runsc-live-probes:
    name: secure-core-runsc-live-probes
    runs-on: [self-hosted, linux, runsc]
    if: github.event_name != 'pull_request' && vars.PLASMAWORK_RUNSC_LIVE_PROBES == '1'
    environment: security-live
    env:
      NODE_ENV: test
      PLASMAWORK_RUNSC_PROBES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight runsc availability
        run: runsc --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/secure_core/package-lock.json

      - name: Install secure_core dependencies
        run: npm --prefix packages/secure_core ci

      - name: Run live runsc probes
        run: scripts/test/security_live_runsc.sh

  secure-core-worm-live-probes:
    name: secure-core-worm-live-probes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && vars.PLASMAWORK_WORM_LIVE_PROBES == '1'
    environment: security-live
    permissions:
      contents: read
      id-token: write
    env:
      NODE_ENV: test
      PLASMAWORK_ANCHOR_LIVE_PROBES: "1"
      PLASMAWORK_ANCHOR_PROVIDER: s3
      PLASMAWORK_ANCHOR_S3_BUCKET: ${{ vars.PLASMAWORK_ANCHOR_S3_BUCKET }}
      PLASMAWORK_ANCHOR_S3_REGION: ${{ vars.PLASMAWORK_ANCHOR_S3_REGION }}
      PLASMAWORK_ANCHOR_S3_ENDPOINT: ${{ vars.PLASMAWORK_ANCHOR_S3_ENDPOINT }}
      PLASMAWORK_ANCHOR_S3_KEY_PREFIX: ${{ vars.PLASMAWORK_ANCHOR_S3_KEY_PREFIX || 'ci/live-worm-probes' }}
      PLASMAWORK_ANCHOR_RETENTION_DAYS: ${{ vars.PLASMAWORK_ANCHOR_RETENTION_DAYS || '1' }}
      AWS_REGION: ${{ vars.PLASMAWORK_ANCHOR_S3_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for WORM probe
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLASMAWORK_WORM_PROBE_ROLE_ARN }}
          aws-region: ${{ vars.PLASMAWORK_ANCHOR_S3_REGION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/secure_core/package-lock.json

      - name: Install secure_core dependencies
        run: npm --prefix packages/secure_core ci

      - name: Run live WORM Object-Lock probes
        run: scripts/test/security_live_worm.sh

  cross-process-smoke:
    name: cross-process-smoke
    runs-on: ubuntu-latest
    # Layer 4 of the cross-process wiring test strategy (2026-05-10).
    # Spawns FastAPI as a subprocess and POSTs gateway-signed handoff
    # headers directly, proving the HMAC byte contract between the TS
    # signer and the Python verifier. Opt-in via repository variable
    # so PR runs stay fast.
    if: github.event_name != 'pull_request' && vars.PLASMAWORK_CROSS_PROCESS_SMOKE == '1'
    env:
      PLASMAWORK_CROSS_PROCESS_SMOKE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbench Python package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e packages/core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/workbench-gateway/package-lock.json

      - name: Install gateway dependencies
        run: npm --prefix apps/workbench-gateway ci

      - name: Run Layer 4 cross-process smoke
        run: scripts/test/cross_process_smoke.sh

  ui-cross-process-e2e:
    name: ui-cross-process-e2e
    runs-on: ubuntu-latest
    # Layer 5 of the cross-process wiring test strategy. Drives a real
    # Chromium against vite-dev + a stub gateway to catch the SPA-
    # fallback regression shape (vite serving 200 text/html for a
    # proxied path). Opt-in via repo variable; scheduled nightly only.
    if: github.event_name != 'pull_request' && vars.PLASMAWORK_E2E == '1'
    env:
      PLASMAWORK_E2E: "1"
      CI: "true"
      PLAYWRIGHT_INSTALL_BROWSERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/workbench-ui/package-lock.json

      - name: Install workbench-ui dependencies
        run: npm --prefix apps/workbench-ui ci

      - name: Run Layer 5 Playwright E2E
        run: scripts/test/cross_process_e2e.sh

  codeql-typescript:
    name: codeql-typescript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  dependency-license-review:
    name: dependency-license-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dependency and license review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
